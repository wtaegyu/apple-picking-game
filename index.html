<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apple Picking Game</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #f1f8ed; color: #243729; font-family: Arial, sans-serif; }
  main { max-width: 860px; margin: 30px auto; padding: 24px; text-align: center; }
  h1 { margin: 0 0 10px; font-size: clamp(28px, 5vw, 44px); }
  p { line-height: 1.6; }
  .score { font-size: 22px; font-weight: bold; }
  .garden { position: relative; height: 390px; margin: 24px 0; overflow: hidden; border-radius: 24px; background: #dff0d2; }
  .trunk { position: absolute; left: 45%; bottom: 12px; width: 10%; height: 210px; border-radius: 15px; background: #8a5c3c; }
  .leaves { position: absolute; left: 12%; top: 20px; width: 76%; height: 290px; border-radius: 48%; background: #3e7c45; }
  .apple { position: absolute; width: 64px; height: 64px; padding: 0; border: 0; background: transparent; font-size: 46px; cursor: pointer; transition: transform .15s; }
  .apple:hover { transform: scale(1.2); }
  .apple:focus-visible { outline: 3px solid #fff; border-radius: 14px; }
  .apple:disabled { visibility: hidden; }
  #message { min-height: 32px; font-size: 21px; font-weight: bold; }
  #restart { padding: 12px 26px; border: 0; border-radius: 10px; background: #255e34; color: white; font-size: 18px; cursor: pointer; }
  footer { margin-top: 22px; color: #526958; font-size: 14px; }
  @media (max-width: 500px) { main { padding: 16px; } .apple { width: 46px; height: 56px; font-size: 36px; } }
</style>
</head>
<body>
<main>
  <h1>🍎 Apple Picking Game</h1>
  <p>나무의 사과를 클릭해서 모두 모아 보세요!</p>
  <div class="score" aria-live="polite">수확한 사과: <span id="score">0</span> / 8</div>
  <div class="garden" id="garden" aria-label="사과나무">
    <div class="trunk" aria-hidden="true"></div>
    <div class="leaves" aria-hidden="true"></div>
  </div>
  <p id="message" role="status">사과를 눌러 수확을 시작하세요.</p>
  <button id="restart" type="button">다시 시작</button>
  <footer>GitHub 첫 프로젝트 · 별도 설치 없이 index.html로 실행</footer>
</main>
<script>
  const positions = [[25, 55], [44, 35], [64, 65], [17, 140],
                     [38, 130], [60, 150], [29, 215], [52, 230]];
  const garden = document.querySelector('#garden');
  const scoreText = document.querySelector('#score');
  const message = document.querySelector('#message');
  let score = 0;

  function startGame() {
    score = 0;
    scoreText.textContent = score;
    message.textContent = '사과를 눌러 수확을 시작하세요.';
    garden.querySelectorAll('.apple').forEach(apple => apple.remove());

    positions.forEach(([left, top], index) => {
      const apple = document.createElement('button');
      apple.type = 'button';
      apple.className = 'apple';
      apple.textContent = '🍎';
      apple.style.left = left + '%';
      apple.style.top = top + 'px';
      apple.setAttribute('aria-label', (index + 1) + '번 사과 수확');
      apple.addEventListener('click', () => {
        if (apple.disabled) return;
        apple.disabled = true;
        score += 1;
        scoreText.textContent = score;
        message.textContent = score === positions.length
          ? '🎉 성공! 사과 8개를 모두 수확했어요!'
          : '좋아요! 남은 사과도 모아 보세요.';
      });
      garden.appendChild(apple);
    });
  }

  document.querySelector('#restart').addEventListener('click', startGame);
  startGame();
</script>
</body>
</html>
